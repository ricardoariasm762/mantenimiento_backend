server.port=8082

# Conexión PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vehiculos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ruta al modelo ONNX dentro de resources
onnx.model.path=models/model_vehicle_fault.onnx

# Clave y configuración LLM (Spring AI)
spring.ai.openai.api-key=${AI_API_KEY:demo-key}
